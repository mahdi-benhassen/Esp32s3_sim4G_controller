name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ESP_IDF_VERSION: v5.3.2
  ESP_TARGET: esp32s3

jobs:
  host-validation:
    name: Host validation
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Compile host validation scripts
        run: python -m py_compile test_host/test_project.py test_host/validate_workflows.py test_host/validate_docs.py

      - name: Run project validation
        run: python test_host/test_project.py

      - name: Validate workflow structure
        run: python test_host/validate_workflows.py

      - name: Validate documentation
        run: python test_host/validate_docs.py

      - name: Check repository whitespace
        run: git diff --check

  behavior-tests:
    name: Host behavior tests
    runs-on: ubuntu-22.04
    needs: host-validation
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ESP-IDF host headers and Unity
        run: |
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          git clone --depth 1 https://github.com/ThrowTheSwitch/Unity.git "$RUNNER_TEMP/unity"

      - name: Run Unity behavior tests
        env:
          IDF_PATH: ${{ runner.temp }}/esp-idf
          UNITY_PATH: ${{ runner.temp }}/unity
        run: |
          mkdir -p build/config
          printf '#pragma once\n' > build/config/sdkconfig.h
          test_host/run_behavior_tests.sh

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-22.04
    needs: host-validation
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install analyzers, ESP-IDF headers, and Unity
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          git clone --depth 1 https://github.com/ThrowTheSwitch/Unity.git "$RUNNER_TEMP/unity"
          mkdir -p build/config
          printf '#pragma once\n' > build/config/sdkconfig.h

      - name: Run cppcheck
        run: >-
          cppcheck --enable=warning,style,performance,portability
          --error-exitcode=1 --suppress=missingIncludeSystem
          --language=c --std=c11
          main/b2_core.c test_host/test_behavior.c

      - name: Run clang-tidy
        run: >-
          clang-tidy main/b2_core.c test_host/test_behavior.c
          --checks='-*,bugprone-argument-comment,bugprone-bool-pointer-implicit-conversion,bugprone-dangling-handle,bugprone-integer-division,bugprone-macro-parentheses,bugprone-misplaced-widening-cast,bugprone-sizeof-expression,bugprone-suspicious-memset-usage,performance-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling'
          --warnings-as-errors='*'
          -- -std=c11 -D_GNU_SOURCE
          -Ibuild/config -Imain/include
          -I${{ runner.temp }}/unity/src
          -I${{ runner.temp }}/esp-idf/components/esp_common/include

  firmware-build:
    name: ESP-IDF firmware build
    runs-on: ubuntu-22.04
    needs: [host-validation, behavior-tests, static-analysis]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ env.ESP_TARGET }}
          command: 'idf.py build'

      - name: Package firmware outputs
        run: |
          mkdir -p artifacts
          cp build/kincony_b2_esp32s3.bin artifacts/
          cp build/bootloader/bootloader.bin artifacts/
          cp build/partition_table/partition-table.bin artifacts/
          cp build/ota_data_initial.bin artifacts/
          cp partitions.csv artifacts/
          sha256sum artifacts/* | tee artifacts/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: kincony-b2-esp32s3-firmware-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-build-failure-${{ github.run_id }}
          path: build/log/
          if-no-files-found: ignore
          retention-days: 7
